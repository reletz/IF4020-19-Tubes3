name: release

# main menghasilkan tag edge dan sha-<commit>. Tag v* menghasilkan tag versi.
# Image dipublikasikan hanya setelah ci.yml lulus.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: reletz/nadina

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # Secret DOCKER_PUSH_TOKEN dan variable DOCKER_USERNAME ada di environment ini.
    environment: nadina
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tag dan label
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}

      # Scan dilakukan pada image amd64 yang dibangun lokal, sebelum login dan push.
      - name: Build amd64 untuk scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: nadina:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (gagal jika ada HIGH atau CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nadina:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Login Docker Hub (token push)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PUSH_TOKEN }}

      - name: Build multi-arch dan push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Ringkasan digest
        run: |
          {
            echo "### Image terbit"
            echo ""
            echo "Digest index (kunci referensi ini di pipeline pemakai):"
            echo ""
            echo '```'
            echo "${IMAGE}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo ""
            echo "Tag:"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
