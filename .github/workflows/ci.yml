name: ci

# Pull request dan push ke cabang selain main. Untuk main dan tag v*, CI
# dipanggil dari release.yml (workflow_call) supaya rilis selalu menunggu CI.
# Trigger pull_request (bukan pull_request_target), jadi PR dari fork berjalan
# tanpa secret dan tanpa token tulis.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Sama dengan ELIXIR_IMAGE di Dockerfile.
  ELIXIR_IMAGE: elixir:1.20-otp-29-alpine@sha256:a2f0fe1bfd8a2f9cc91d913f4a12e6430e27e618720f753a514e2fff3d35f5a7

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Dependensi (harus sesuai mix.lock)
        run: mix deps.get --check-locked
      - name: Audit dependensi (retired atau advisory)
        run: mix hex.audit
      - name: Format
        run: mix format --check-formatted
      - name: Credo
        run: mix credo
      - name: Test
        run: mix test
      - name: Cache PLT dialyzer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp29-ex1.20-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-otp29-ex1.20-
      - name: Dialyzer
        run: mix dialyzer

  # Alpine memakai musl dan OpenSSL berbeda dari Ubuntu, jadi uji kripto
  # dijalankan juga di lingkungan yang sama dengan image rilis.
  test-alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test di dalam Alpine
        run: |
          docker run --rm -v "$PWD:/src:ro" "$ELIXIR_IMAGE" sh -c '
            set -eu
            mkdir /tmp/work
            cp -r /src/mix.exs /src/mix.lock /src/lib /src/test /tmp/work/
            cd /tmp/work
            mix local.hex --force >/dev/null
            mix local.rebar --force >/dev/null
            mix deps.get >/dev/null
            MIX_ENV=test mix test
          '

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image uji
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: nadina:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (gagal jika ada HIGH atau CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nadina:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
